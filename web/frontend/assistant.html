<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robo Express - AI 비서</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/assistant.css">
</head>
<body>
  <div class="assistant-container">
    <!-- 로봇 얼굴 -->
    <div class="robot-face" id="robotFace">
      <div class="face-background">
        <div class="pulse-ring" id="pulseRing"></div>
      </div>
      <div class="eyes">
        <div class="eye left" id="eyeLeft">
          <div class="pupil"></div>
        </div>
        <div class="eye right" id="eyeRight">
          <div class="pupil"></div>
        </div>
      </div>
      <div class="mouth" id="mouth"></div>
    </div>

    <!-- 상태 텍스트 -->
    <div class="status-text" id="statusText">
      "로보야" 라고 불러주세요
    </div>

    <!-- 대화 내용 -->
    <div class="chat-container" id="chatContainer">
      <div class="chat-messages" id="chatMessages"></div>
    </div>

    <!-- 입력 영역 -->
    <div class="input-area">
      <button class="mic-button" id="micButton">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
      <input type="text" class="text-input" id="textInput" placeholder="텍스트로 입력하기...">
      <button class="send-button" id="sendButton">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>

    <!-- 홈 버튼 -->
    <a href="index.html" class="home-button">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </a>
  </div>

  <script src="js/assistant.js"></script>
</body>
</html>
